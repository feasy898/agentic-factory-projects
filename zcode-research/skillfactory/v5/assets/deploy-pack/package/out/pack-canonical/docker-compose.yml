name: asr-minutes-todo

services:
  asr:
    image: "${ASR_IMAGE:-placeholder/asr:dev}"
    restart: unless-stopped
    environment:
      ASR_OUTPUT_DIR: "${ASR_OUTPUT_DIR:-./data/asr-out}"
      ASR_MODEL: "${ASR_MODEL:-base}"
    volumes:
      - "${ASR_INPUT_DIR:-./data/asr-in}:/data/in"
      - "${ASR_OUTPUT_DIR:-./data/asr-out}:/data/out"
    ports:
      - "${ASR_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  minutes:
    image: "${MINUTES_IMAGE:-placeholder/minutes:dev}"
    restart: unless-stopped
    environment:
      MINUTES_INPUT_DIR: "${MINUTES_INPUT_DIR:-./data/asr-out}"
      MINUTES_OUTPUT_DIR: "${MINUTES_OUTPUT_DIR:-./data/minutes-out}"
    volumes:
      - "${MINUTES_INPUT_DIR:-./data/asr-out}:/data/in"
      - "${MINUTES_OUTPUT_DIR:-./data/minutes-out}:/data/out"
    ports:
      - "${MINUTES_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  todo:
    image: "${TODO_IMAGE:-placeholder/todo:dev}"
    restart: unless-stopped
    environment:
      TODO_DATA_DIR: "${TODO_DATA_DIR:-./data/todo}"
    volumes:
      - "${TODO_DATA_DIR:-./data/todo}:/data"
    ports:
      - "${TODO_PORT:-8003}:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfcore"
version = "1.0.0"
description = "PlayableSpec validator (regen pilot): python -m pfcore validate"
requires-python = ">=3.10"
dependencies = [
    "jsonschema==4.26.0",
    "pydantic==2.13.5",
]

[tool.setuptools]
packages = ["pfcore"]

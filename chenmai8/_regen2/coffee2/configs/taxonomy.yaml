# =====================================================================
# BeanEye 缺陷分类体系（taxonomy）· 契约附件 v1.0（冻结）
# ---------------------------------------------------------------------
# 本文件是 beaneye/taxonomy.py 的唯一数据源；全链路 defect 字段的合法
# 取值 = classes 的 key。字段语义：
#   kind             primary=主缺陷 | secondary=次缺陷 | normal=好豆
#   counts_as_defect 是否计入缺陷计数（peaberry 计量不计缺陷，仅标注保留；
#                    W13 修复：非缺陷类不参与「最严重缺陷」比较）
#   verified         类别主/次归属与中/英文名是否已对照契约核定
#   vi_verified      越南语译名是否经核对（当前全部 false，待回填）
# severity_order：严重度默认序，0=normal，越靠后越严重；
#                 各标准 YAML 可按原文覆盖自己的序。
# W13 公开树清理：upstream_mapping（素材来源类别 → 本体系 key）已移出到
# 不入库内部文件 configs/upstream_mapping.internal.yaml（原标签属上游项目
# 命名，不得随公开仓分发；loader 对含该节的 taxonomy 仍兼容）。加载器
# （beaneye/taxonomy.py）支持任意来源代号的映射，目标 key 必须在 classes。
# =====================================================================
version: 1

classes:
  normal:   {kind: normal,    zh: 好豆,        en: normal,    vi: hat tot,      counts_as_defect: false, verified: true, vi_verified: false}
  broken:   {kind: secondary, zh: 破碎,        en: broken,    vi: hat vo,       counts_as_defect: true,  verified: true, vi_verified: false}
  faded:    {kind: secondary, zh: 褪色/白化,   en: faded,     vi: hat nhat mau, counts_as_defect: true,  verified: true, vi_verified: false}
  brocade:  {kind: secondary, zh: 花脸,        en: brocade,   vi: hat loang,    counts_as_defect: true,  verified: true, vi_verified: false}
  immature: {kind: secondary, zh: 未熟,        en: immature,  vi: hat non,      counts_as_defect: true,  verified: true, vi_verified: false}
  peaberry: {kind: secondary, zh: 花豆/胡椒粒豆, en: peaberry, vi: peaberry,    counts_as_defect: false, verified: true, vi_verified: false}
  shell:    {kind: secondary, zh: 贝壳豆,      en: shell,     vi: hat mai,      counts_as_defect: true,  verified: true, vi_verified: false}
  elephant: {kind: secondary, zh: 象豆,        en: elephant,  vi: hat voi,      counts_as_defect: true,  verified: true, vi_verified: false}
  insect:   {kind: primary,   zh: 虫蛀,        en: insect,    vi: hat mot,      counts_as_defect: true,  verified: true, vi_verified: false}
  dried:    {kind: primary,   zh: 干瘪/僵豆,   en: dried,     vi: hat thoc,     counts_as_defect: true,  verified: true, vi_verified: false}
  sour:     {kind: primary,   zh: 酸豆,        en: sour,      vi: hat chua,     counts_as_defect: true,  verified: true, vi_verified: false}
  mold:     {kind: primary,   zh: 霉豆,        en: mold,      vi: hat moc,      counts_as_defect: true,  verified: true, vi_verified: false}
  black:    {kind: primary,   zh: 黑豆,        en: black,     vi: hat den,      counts_as_defect: true,  verified: true, vi_verified: false}

severity_order: [normal, broken, faded, brocade, immature, peaberry, shell, elephant, insect, dried, sour, mold, black]

notes:
  - severity_order 为契约默认序；不同标准可在标准 YAML 覆盖（不同标准可不同）。
  - peaberry 计量不计缺陷（counts_as_defect=false），但保留标注与严重度位次。
  - 越南语译名为占位（vi_verified=false），标准核对（D1）后回填并置 true。
  - upstream_mapping 已移出不入库内部文件（configs/upstream_mapping.internal.yaml）；
    含该节的 taxonomy 仍可加载，目标 key 必须存在于 classes，null 表示明确不映射。

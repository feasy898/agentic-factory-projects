# =====================================================================
# BeanEye 标准配置 · DB46/T 642 海南中粒种(罗布斯塔)生咖啡（db46_t642）
# ---------------------------------------------------------------------
# 对应海南省地方标准 DB46/T 642（2024 版，中粒种咖啡/罗布斯塔生咖啡
# 质量方向）。D1 原文核对未取到等级表全文，本文件的级别命名（特级/
# 一级/合格）与全部阈值是**结构化占位基线**（参照 §3.3 CQI 结构自定），
# 一律 verified: false，护照页脚显示"标准阈值核对中"角标；取得原文后
# 回填并置 true。
# 与另两套的差异点：本套启用全局色差条件 delta_e_max（占位值 10.0，
# ΔE76 对 reference_lab，CIE76 口径与 M8 一致）；"合格"级不设筛目条件。
# 字段语义与判定规则见 cqi_fine_robusta.yaml 文件头（同 schema）。
# =====================================================================

standard: db46_t642
display:
  zh: DB46/T 642 罗布斯塔生咖啡
  en: DB46/T 642 Robusta Green Coffee
  vi: DB46/T 642 Cà phê Robusta
sample_g: 300                       # 抽样基量（克）：占位基线，待原文核对
count_rule: most_severe_per_bean
severity_order: [normal, broken, faded, brocade, immature, peaberry, shell, elephant, insect, dried, sour, mold, black]

defect_classes:
  normal:   {kind: normal,    zh: 好豆,          en: normal,    vi: hat tot}
  broken:   {kind: secondary, zh: 破碎,          en: broken,    vi: hat vo}
  faded:    {kind: secondary, zh: 褪色/白化,     en: faded,     vi: hat nhat mau}
  brocade:  {kind: secondary, zh: 花脸,          en: brocade,   vi: hat loang}
  immature: {kind: secondary, zh: 未熟,          en: immature,  vi: hat non}
  peaberry: {kind: secondary, zh: 花豆/胡椒粒豆, en: peaberry,  vi: peaberry}
  shell:    {kind: secondary, zh: 贝壳豆,        en: shell,     vi: hat mai}
  elephant: {kind: secondary, zh: 象豆,          en: elephant,  vi: hat voi}
  insect:   {kind: primary,   zh: 虫蛀,          en: insect,    vi: hat mot}
  dried:    {kind: primary,   zh: 干瘪/僵豆,     en: dried,     vi: hat thoc}
  sour:     {kind: primary,   zh: 酸豆,          en: sour,      vi: hat chua}
  mold:     {kind: primary,   zh: 霉豆,          en: mold,      vi: hat moc}
  black:    {kind: primary,   zh: 黑豆,          en: black,     vi: hat den}

grades:                             # 从最优到最差排列（命名与阈值为占位基线）
  - name: 特级
    primary_max: 0                  # 主缺陷 0 粒
    secondary_full_max: 4           # 次缺陷全样累计 ≤4 粒
    sieve_min: 14                   # v0 语义：筛目 <14 的粒数须为 0
    verified: false
  - name: 一级
    primary_max: 1
    secondary_full_max: 8
    sieve_min: 13
    verified: false
  - name: 合格
    primary_max: 3
    secondary_full_max: 18
    sieve_min: null                 # 合格级不设筛目条件（占位基线）
    verified: false

fail_grade: 等外

metrology:
  sieve_targets:
    min_screen: 12                  # 整盘基准目数（占位基线）
    verified: false
  reference_lab: [50, -6, 19]       # 生豆参考色占位（0-255 标度；实测后回填）
  reference_lab_verified: false
  delta_e_max: 10.0                 # 全局色差条件（占位基线；ΔE76 口径）

weight:
  model: area_linear
  g_per_mm2: 0.00042                # 占位系数；到货后标定回填
  verified: false

# =====================================================================
# BeanEye 分拣线（SO-101）配置 · v1
# ---------------------------------------------------------------------
# 加载器：beaneye/sort/config.py（load_sort_config）；坐标约定：
#   桌面坐标系 —— 原点 = 臂基座与桌面交点，x 向前、y 向左，z 高度（0=桌面），
#   单位毫米。凡 *_mm 字段一律本坐标系（与质检线的盘面毫米系不同，
#   由 beaneye/sort/frame.py 的 FrameToTable 映射）。
# 带「明日实测」标注的字段 = 占位默认值，真机联调后回填（见
# docs/SO101联调手册.md 的 checklist）。
# =====================================================================
version: 1

# ---- 工作空间安全包络（Mock/Session/真机适配器共用的边界校验） ----------
# 占位默认按 SO-101 桌面摆臂可达域内收一圈；明日按实际安装实测收缩/平移。
workspace:
  x_min_mm: 55.0        # 基座正下方/线缆区留空（占位几何下更近基座需超大折肘，不可达）
  x_max_mm: 200.0
  y_min_mm: -100.0
  y_max_mm: 100.0
  z_min_mm: 0.0         # 0=桌面
  z_max_mm: 140.0
  home_mm: [120.0, 0.0, 100.0]   # 安全高空点（回 home / 急停前的巡逻位）

# ---- 限速（mm/s）：max 为硬上限，任何指令请求超限即拒绝 ------------------
speeds:
  max_mm_s: 120.0       # 硬上限（安全红线，真机空载试跑期间建议再收紧）
  default_mm_s: 80.0    # 未指明速度时的缺省
  travel_mm_s: 80.0     # 巡航高度平移
  descend_mm_s: 25.0    # 接近豆面下降（慢速）
  lift_mm_s: 50.0       # 夹取后抬起

# ---- 抓取动作参数 -------------------------------------------------------
pick:
  pick_z_mm: 8.0        # 抓取面高度（豆顶面；明日按实际豆堆高度回填）
  travel_z_mm: 70.0     # 巡航安全高度（须 <= workspace.z_max_mm）
  gripper_travel_s: 0.3 # 夹爪开合动作耗时（Mock 模拟与真机等待均用）

# ---- 托盘系 → 臂系平面外参（相机中心相对臂基座偏移 + 残余平面旋转） ------
# 全零占位：明日用三点标定（beaneye.sort.frame.solve_affine 或本节回填）实测。
# 做法见 docs/SO101联调手册.md「外参三点标定」节。
extrinsic:
  yaw_deg: 0.0          # 托盘系相对臂系的平面旋转角（度，逆时针为正）
  offset_mm: [0.0, 0.0] # 托盘原点在臂系中的位置 [dx, dy]（相机/托盘相对基座偏移）

# ---- 缺陷类别 → 分级盒桌面坐标（mm） ------------------------------------
# key 必须是 configs/taxonomy.yaml 的类别 key；default = 未登记类别兜底盒。
# 布局占位：臂前方一排 6 盒 + 兜底盒（盒间距 >= 35mm），明日按实物摆放回填。
bins:
  black:    [170.0, -75.0]
  mold:     [170.0, -45.0]
  sour:     [170.0, -15.0]
  dried:    [170.0,  15.0]
  insect:   [170.0,  45.0]
  broken:   [170.0,  75.0]
  faded:    [140.0,  90.0]
  brocade:  [110.0,  90.0]
  immature: [ 80.0,  90.0]
  shell:    [140.0, -90.0]
  elephant: [110.0, -90.0]
  peaberry: [ 80.0, -90.0]
  default:  [ 65.0,  90.0]

# ---- 软件急停语义 -------------------------------------------------------
estop:
  torque_off: true                    # 急停即下力矩（臂可被徒手搬动）
  require_home_after_resume: true     # 急停复位后必须重新 home 才允许作业

# ---- SO-101 真机参数（Feetech 总线） ------------------------------------
# 连杆几何为公开资料占位值，明日实测核对（公差与装配会带来数毫米级偏差）。
# 位置寄存器换算按 STS3215 常见标定（4096 步/360°，中位 2048）；同待核对。
so101:
  port: "COM3"            # 明日插上 USB-UART 后在设备管理器确认回填
  baudrate: 1000000       # Feetech 常用 1M
  base_offset_mm: 22.0    # 基座旋转轴 → 肩关节水平径向偏移
  shoulder_z_mm: 45.0     # 肩关节离桌面高度（含底座）
  l1_mm: 103.0            # 肩 → 肘 有效连杆长
  l2_mm: 112.0            # 肘 → 腕+夹爪 有效连杆长（含竖直工具段）
  speed_scaling: 1.0      # mm/s → 舵机速度寄存器值换算系数（明日标定）
  move_timeout_s: 10.0    # 单段运动到位等待超时
  poll_interval_s: 0.02   # 到位轮询间隔
  arrival_tol_deg: 3.0    # 判定到位的关节角容差
  motors:                 # SO-101 六路舵机（名称: {id, 关节限位(度), 位置换算}）
    # 关节限位为宽松占位（近基座目标需要大折肘/大沉肩）；明日按装配实测收紧
    # ——安全主闸是 workspace 毫米包络，关节限位是硬件保护第二闸。
    base:     {id: 1, min_deg: -170.0, max_deg: 170.0, center_raw: 2048.0, raw_per_deg: 11.3778}
    shoulder: {id: 2, min_deg: -145.0, max_deg: 145.0, center_raw: 2048.0, raw_per_deg: 11.3778}
    elbow:    {id: 3, min_deg: -160.0, max_deg: 160.0, center_raw: 2048.0, raw_per_deg: 11.3778}
    wrist:    {id: 4, min_deg: -160.0, max_deg: 160.0, center_raw: 2048.0, raw_per_deg: 11.3778}
    roll:     {id: 5, min_deg: -160.0, max_deg: 160.0, center_raw: 2048.0, raw_per_deg: 11.3778}
    gripper:  {id: 6, min_deg: 0.0,    max_deg: 70.0,  center_raw: 2048.0, raw_per_deg: 11.3778}
  gripper_open_deg: 60.0    # 夹爪张开角（度）
  gripper_closed_deg: 18.0  # 夹爪夹紧角（度；空载标定，夹豆回填）

# 拦截代答/拒答文案库（outguard / M5）。本文件是运营可改的权威副本；
# 文件缺失或单条目缺键时回落 outguard/fallback.py 内置默认（两者内容保持一致）。
# 拒答：BLOCK 时按决定性 reason code 取 block.by_code 模板（第一条 reasons 为
#       决定性理由）；未配置的 code 回落 block.default。
# 代答：关键词 → 固定口径问答（MVP 子串匹配，条目序即优先级，首个命中生效；
#       P2 升级语义匹配）。命中时拼在拒答文案之后随 403 message 同体下发。
# 注意：文案是面向部门调用方的提示面——不要嵌入任何具体人员/单据/原文示例。
block:
  default: "涉密/涉敏内容已拦截，请通过保密渠道办理或删除敏感标识后重试"
  by_code:
    CLASSIFICATION_MARK: "您的提问包含密级标识或内部资料字样，已按保密要求拦截。涉密事项请通过本单位保密渠道线下办理。"
    INJECTION: "检测到疑似提示注入指令，已拦截本次请求。请勿在提交材料中嵌入操控模型行为的指令文本。"
    OUTPUT_MODERATION: "回答内容未通过输出侧复检，已拦截本次响应。"
canned:
  - id: classified_consult
    keywords: [借阅, 查阅流程, 定密, 解密, 保密委员会]
    answer: "涉密载体与内部资料的借阅、定密、解密事项，请携带工作证件经本单位保密部门按线下流程办理，本平台不受理涉密咨询。"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pfcore"
version = "0.1.0"
description = "试玩广告生产线编排 CLI：spec 校验 → 构建 → 打包 → 质检 → 汇总"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13,<3",
    "jsonschema>=4.26,<5",
]

[tool.setuptools]
# python/ 下并列着多个运行模块，随各自里程碑逐个正规化。
# pfcore：编排 CLI（M1 起已正规化）；qacore：质检器（T1.4 起正规化，
# 验收命令 `python -m qacore run ...` 不再依赖仓库根 cwd 或 .pth hack）；
# assetkit：素材管线（M5 起正规化，验收命令 `python -m assetkit run ...`）。
packages = ["pfcore", "qacore", "assetkit"]
